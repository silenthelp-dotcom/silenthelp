<!-- ══ FadingVideo — rAF crossfade, manual loop ══ -->
<script type="text/babel">
const { useRef, useEffect } = React;

const FADE_MS = 500;
const FADE_OUT_LEAD = 0.55; // seconds before `ended` to begin fading out

/*
 * Looping background video with a JS-driven crossfade.
 *
 * `loop` is deliberately OFF: the browser's native loop restarts instantly with
 * a visible hard cut. Instead we watch `timeupdate`, start fading out
 * FADE_OUT_LEAD seconds before the end, then rewind and fade back in on
 * `ended`. Opacity is animated with requestAnimationFrame rather than a CSS
 * transition so a new fade can resume from wherever the previous one stopped
 * (reading the live value off video.style.opacity) instead of jumping.
 */
function FadingVideo({ src, className, style, poster }) {
  const videoRef = useRef(null);
  const rafRef = useRef(0);
  const fadingOutRef = useRef(false);

  useEffect(() => {
    const video = videoRef.current;
    if (!video) return;

    const fadeTo = (target, duration = FADE_MS) => {
      cancelAnimationFrame(rafRef.current);
      const from = parseFloat(video.style.opacity || "0");
      const start = performance.now();
      const step = (now) => {
        const t = Math.min((now - start) / duration, 1);
        video.style.opacity = String(from + (target - from) * t);
        if (t < 1) rafRef.current = requestAnimationFrame(step);
      };
      rafRef.current = requestAnimationFrame(step);
    };

    const onLoaded = () => {
      video.style.opacity = "0";
      const p = video.play();
      if (p && p.catch) p.catch(() => {}); // autoplay can be refused; keep the frame
      fadeTo(1);
    };
    const onTime = () => {
      const d = video.duration;
      if (!fadingOutRef.current && d && d - video.currentTime <= FADE_OUT_LEAD && d - video.currentTime > 0) {
        fadingOutRef.current = true;
        fadeTo(0);
      }
    };
    const onEnded = () => {
      video.style.opacity = "0";
      setTimeout(() => {
        video.currentTime = 0;
        const p = video.play();
        if (p && p.catch) p.catch(() => {});
        fadingOutRef.current = false;
        fadeTo(1);
      }, 100);
    };

    video.addEventListener("loadeddata", onLoaded);
    video.addEventListener("timeupdate", onTime);
    video.addEventListener("ended", onEnded);
    if (video.readyState >= 2) onLoaded();

    return () => {
      cancelAnimationFrame(rafRef.current);
      video.removeEventListener("loadeddata", onLoaded);
      video.removeEventListener("timeupdate", onTime);
      video.removeEventListener("ended", onEnded);
    };
  }, [src]);

  return (
    <video ref={videoRef} className={className} style={{ opacity: 0, ...style }}
           src={src} poster={poster} autoPlay muted playsInline preload="auto" aria-hidden="true" />
  );
}
window.FadingVideo = FadingVideo;
</script>

<!-- ══ BlurText — word-by-word blur-in ══ -->
<script type="text/babel">
const { useRef, useEffect, useState } = React;
const { motion } = window.Motion;

function BlurText({ text, className = "", delayMs = 100 }) {
  const ref = useRef(null);
  const [show, setShow] = useState(false);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    // Respect reduced motion: render the line immediately, no per-word stagger.
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) { setShow(true); return; }
    const io = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setShow(true); io.disconnect(); }
    }, { threshold: 0.1 });
    io.observe(el);
    return () => io.disconnect();
  }, []);

  const words = text.split(" ");
  return (
    <p ref={ref} className={className}
       style={{ display:"flex", flexWrap:"wrap", justifyContent:"center", rowGap:"0.1em" }}>
      {words.map((w, i) => (
        <motion.span
          key={w + i}
          initial={{ filter:"blur(10px)", opacity:0, y:50 }}
          animate={show ? {
            filter:["blur(10px)","blur(5px)","blur(0px)"],
            opacity:[0, 0.5, 1],
            y:[50, -5, 0]
          } : {}}
          transition={{ duration:0.7, times:[0,0.5,1], ease:"easeOut", delay:(i*delayMs)/1000 }}
          /* marginRight rather than a non-breaking space: the -4px tracking
             collapses an nbsp and the words run together. */
          style={{ display:"inline-block", marginRight:"0.28em" }}
        >{w}</motion.span>
      ))}
    </p>
  );
}
window.BlurText = BlurText;
</script>

        {rows.map(([t, d]) => (
          <div key={t} className="liquid-glass rounded-[1.25rem] p-6 flex flex-col md:flex-row md:items-center gap-3 md:gap-8">
            <h3 className="font-heading italic text-white text-2xl md:text-3xl tracking-[-1px] md:w-[38%] shrink-0">{t}</h3>
            <p className="text-sm text-white/90 font-body font-light leading-snug">{d}</p>
          </div>
        ))}
      </div>
    </Band>
  );
}

function Privacy() {
  const vows = [
    "Detection runs on your device. Raw text is never stored or transmitted.",
    "Only a category and a level are recorded — never what you wrote.",
    "Nothing is sent to anyone automatically. Escalation is drafted; you press send.",
    "No selling data. No training public models on it. No ads, ever.",
    "Export or erase everything, any time, in one click."
  ];
  return (
    <Band id="privacy" kicker="Privacy" title={<>The data<br/>never leaves</>}>
      <div className="mt-14 liquid-glass rounded-[1.25rem] p-8 max-w-3xl">
        <ul className="grid gap-4">
          {vows.map((v) => (
            <li key={v} className="flex gap-4 items-start text-white/90 font-body font-light text-sm leading-snug">
              <span className="mt-0.5 h-5 w-5 rounded-full liquid-glass flex items-center justify-center text-white text-[11px] shrink-0">✓</span>
              <span>{v}</span>
            </li>
          ))}
        </ul>
      </div>
    </Band>
  );
}

function Pricing() {
  const tiers = [
    ["Student", "Free", "Every detection layer, the coping chat, and escalation drafting. No card, no trial clock.", false],
    ["Family", "$4.99", "Up to five people, shared trusted contacts, and a weekly summary for parents — signals only, never content.", true],
    ["Schools", "Custom", "Counselor routing, district deployment, and aggregate wellbeing trends that identify no student.", false]
  ];
  return (
    <Band id="pricing" kicker="Pricing" title={<>Free for the people<br/>who need it most</>}>
      <div className="mt-14 grid grid-cols-1 md:grid-cols-3 gap-6">
        {tiers.map(([name, price, body, feat]) => (
          <div key={name} className={(feat ? "liquid-glass-strong" : "liquid-glass") + " rounded-[1.25rem] p-6 min-h-[300px] flex flex-col"}>
            <p className="text-xs font-body text-white/70 uppercase tracking-[0.14em]">{name}</p>
            <div className="font-heading italic text-white text-5xl tracking-[-2px] leading-none mt-3">
              {price}{name === "Family" && <span className="text-sm not-italic font-body text-white/60 tracking-normal"> / mo</span>}
            </div>
            <p className="mt-4 text-sm text-white/90 font-body font-light leading-snug flex-1">{body}</p>
            <a href="/app" className="mt-6 liquid-glass rounded-full px-5 py-2.5 text-sm font-medium
                                      text-white font-body flex items-center justify-center gap-2">
              {name === "Schools" ? "Talk to us" : "Get started"} <ArrowUpRight className="h-4 w-4" />
            </a>
          </div>
        ))}
      </div>
    </Band>
  );
}

function Footer() {
  return (
    <footer className="bg-black px-8 md:px-16 lg:px-20 py-14 border-t border-white/10">
      <div className="flex flex-wrap items-center gap-6">
        <a href="/" className="flex items-center gap-3 text-white font-body">
          <img src="/static/img/badge-128.png" alt="" className="h-7 w-7 rounded-full"/>
          <span className="text-sm font-medium">SilentHelp</span>
        </a>
        <span className="ml-auto text-xs text-white/50 font-body">© 2026 SilentHelp</span>
        <a href="/privacy" className="text-xs text-white/70 hover:text-white font-body">Privacy</a>
        <a href="/terms" className="text-xs text-white/70 hover:text-white font-body">Terms</a>
        <a href="/careers" className="text-xs text-white/70 hover:text-white font-body">Careers</a>
      </div>
      <p className="mt-8 max-w-3xl text-xs text-white/45 font-body font-light leading-relaxed">
        SilentHelp is a wellbeing companion, not a medical device, and it does not diagnose or
        provide treatment. If you are in immediate danger, call or text <strong className="text-white/70">988</strong>
        &nbsp;(US Suicide &amp; Crisis Lifeline) or your local emergency number.
      </p>
    </footer>
  );
}
window.Science = Science; window.Privacy = Privacy;
window.Pricing = Pricing; window.Footer = Footer;
</script>

<script type="text/babel">
const { Hero, Capabilities, Science, Privacy, Pricing, Footer } = window;

  return (<>
    <Hero/><Capabilities/><Science/><Privacy/><Pricing/><Footer/>
  </>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
