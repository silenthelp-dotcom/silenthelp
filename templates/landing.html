<!-- ══ FadingVideo — rAF crossfade, manual loop ══ -->
<script type="text/babel">
const { useRef, useEffect } = React;

const FADE_MS = 500;
const FADE_OUT_LEAD = 0.55; // seconds before `ended` to begin fading out

/*
 * Looping background video with a JS-driven crossfade.
 *
 * `loop` is deliberately OFF: the browser's native loop restarts instantly with
 * a visible hard cut. Instead we watch `timeupdate`, start fading out
 * FADE_OUT_LEAD seconds before the end, then rewind and fade back in on
 * `ended`. Opacity is animated with requestAnimationFrame rather than a CSS
 * transition so a new fade can resume from wherever the previous one stopped
 * (reading the live value off video.style.opacity) instead of jumping.
 */
function FadingVideo({ src, className, style, poster }) {
  const videoRef = useRef(null);
  const rafRef = useRef(0);
  const fadingOutRef = useRef(false);

  useEffect(() => {
    const video = videoRef.current;
    if (!video) return;

    const fadeTo = (target, duration = FADE_MS) => {
      cancelAnimationFrame(rafRef.current);
      const from = parseFloat(video.style.opacity || "0");
      const start = performance.now();
      const step = (now) => {
        const t = Math.min((now - start) / duration, 1);
        video.style.opacity = String(from + (target - from) * t);
        if (t < 1) rafRef.current = requestAnimationFrame(step);
      };
      rafRef.current = requestAnimationFrame(step);
    };

    const onLoaded = () => {
      video.style.opacity = "0";
      const p = video.play();
      if (p && p.catch) p.catch(() => {}); // autoplay can be refused; keep the frame
      fadeTo(1);
    };
    const onTime = () => {
      const d = video.duration;
      if (!fadingOutRef.current && d && d - video.currentTime <= FADE_OUT_LEAD && d - video.currentTime > 0) {
        fadingOutRef.current = true;
        fadeTo(0);
      }
    };
    const onEnded = () => {
      video.style.opacity = "0";
      setTimeout(() => {
        video.currentTime = 0;
        const p = video.play();
        if (p && p.catch) p.catch(() => {});
        fadingOutRef.current = false;
        fadeTo(1);
      }, 100);
    };

    video.addEventListener("loadeddata", onLoaded);
    video.addEventListener("timeupdate", onTime);
    video.addEventListener("ended", onEnded);
    if (video.readyState >= 2) onLoaded();

    return () => {
      cancelAnimationFrame(rafRef.current);
      video.removeEventListener("loadeddata", onLoaded);
      video.removeEventListener("timeupdate", onTime);
      video.removeEventListener("ended", onEnded);
    };
  }, [src]);

  return (
    <video ref={videoRef} className={className} style={{ opacity: 0, ...style }}
           src={src} poster={poster} autoPlay muted playsInline preload="auto" aria-hidden="true" />
  );
}
window.FadingVideo = FadingVideo;
</script>

<!-- ══ BlurText — word-by-word blur-in ══ -->
<script type="text/babel">
const { useRef, useEffect, useState } = React;
const { motion } = window.Motion;

function BlurText({ text, className = "", delayMs = 100 }) {
  const ref = useRef(null);
  const [show, setShow] = useState(false);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    // Respect reduced motion: render the line immediately, no per-word stagger.
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) { setShow(true); return; }
    const io = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setShow(true); io.disconnect(); }
    }, { threshold: 0.1 });
    io.observe(el);
    return () => io.disconnect();
  }, []);

  const words = text.split(" ");
  return (
    <p ref={ref} className={className}
       style={{ display:"flex", flexWrap:"wrap", justifyContent:"center", rowGap:"0.1em" }}>
      {words.map((w, i) => (
        <motion.span
          key={w + i}
          initial={{ filter:"blur(10px)", opacity:0, y:50 }}
          animate={show ? {
            filter:["blur(10px)","blur(5px)","blur(0px)"],
            opacity:[0, 0.5, 1],
            y:[50, -5, 0]
          } : {}}
          transition={{ duration:0.7, times:[0,0.5,1], ease:"easeOut", delay:(i*delayMs)/1000 }}
          /* marginRight rather than a non-breaking space: the -4px tracking
             collapses an nbsp and the words run together. */
          style={{ display:"inline-block", marginRight:"0.28em" }}
        >{w}</motion.span>
      ))}
    </p>
  );
}
window.BlurText = BlurText;
</script>

<script type="text/babel">
const { useRef, useEffect } = React;

/*
 * The Lithos treatment from the original SilentHelp hero: two stacked images of
 * the same rock — barren on top, alive with moss and flowers underneath — with
 * a spotlight that follows the cursor and reveals the living layer through it.
 * It is the "see beneath the surface" metaphor made literal, which is why it
 * belongs behind "Support that notices first".
 *
 * Differences from the original: that page was WHITE, so the base was rendered
 * with filter:invert(1) to turn the black rock pale. This page is black, so
 * both layers are used as-shot. The mask is a radial-gradient driven by
 * pointer position; on touch (no hover) it falls back to a slow drift so the
 * reveal still reads.
 */
function LithosReveal() {
  const wrapRef = useRef(null);
  const revealRef = useRef(null);
  const rafRef = useRef(0);

  useEffect(() => {
    const wrap = wrapRef.current, reveal = revealRef.current;
    if (!wrap || !reveal) return;

    const R = 260;                         // spotlight radius, px
    const pos = { x: 0.5, y: 0.5 };        // normalized target
    const cur = { x: 0.5, y: 0.5 };        // eased actual
    const fine = matchMedia("(hover: hover) and (pointer: fine)").matches;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

    const paint = () => {
      const r = wrap.getBoundingClientRect();
      const px = cur.x * r.width, py = cur.y * r.height;
      const m = `radial-gradient(circle ${R}px at ${px}px ${py}px,` +
                ` #000 0%, rgba(0,0,0,.86) 42%, rgba(0,0,0,0) 72%)`;
      reveal.style.webkitMaskImage = m;
      reveal.style.maskImage = m;
    };

    const onMove = (e) => {
      const r = wrap.getBoundingClientRect();
      pos.x = (e.clientX - r.left) / r.width;
      pos.y = (e.clientY - r.top) / r.height;
    };

    let t = 0;
    const loop = () => {
      rafRef.current = requestAnimationFrame(loop);
      if (!fine || reduce) {           // no cursor: drift the light slowly
        t += 0.0045;
        pos.x = 0.5 + Math.cos(t) * 0.26;
        pos.y = 0.5 + Math.sin(t * 0.8) * 0.2;
      }
      cur.x += (pos.x - cur.x) * 0.12;  // ease toward the target
      cur.y += (pos.y - cur.y) * 0.12;
      paint();
    };

    if (fine && !reduce) window.addEventListener("pointermove", onMove, { passive: true });
    paint();
    rafRef.current = requestAnimationFrame(loop);

    return () => {
      cancelAnimationFrame(rafRef.current);
      window.removeEventListener("pointermove", onMove);
    };
  }, []);

  return (
    <div ref={wrapRef} className="absolute inset-0 z-0 overflow-hidden" aria-hidden="true">
      {/* barren rock — the surface */}
      <div className="absolute inset-0 bg-cover bg-center bg-no-repeat"
           style={{ backgroundImage:`url("${window.SH_LITHOS_BASE}")` }} />
      {/* the same rock alive — revealed only inside the spotlight */}
      <div ref={revealRef} className="absolute inset-0 bg-cover bg-center bg-no-repeat"
           style={{ backgroundImage:`url("${window.SH_LITHOS_REVEAL}")`,
                    WebkitMaskImage:"radial-gradient(circle 0px at 50% 50%, #000, transparent)",
                    maskImage:"radial-gradient(circle 0px at 50% 50%, #000, transparent)" }} />
      {/* the footage runs edge to edge; fade the bottom so the section below
          does not start on a hard horizon line */}
      <div className="absolute inset-x-0 bottom-0 h-40"
           style={{ background:"linear-gradient(to bottom, transparent, #000)" }} />
    </div>
  );
}
window.LithosReveal = LithosReveal;
</script>

<!-- ══ Mount ══ -->
<script type="text/babel">
const { Hero, Capabilities, Science, Privacy, Pricing, Footer } = window;
function App(){
  return (<>
    <Hero/><Capabilities/><LiveDemo/><Science/><Privacy/><Team/><Pricing/><Footer/>
  </>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

/* ── Scroll reveal ──────────────────────────────────────────────────────
   Runs after mount and tags the content React just rendered. Kept outside
   React deliberately: these are one-shot entrance effects on static markup,
   so an IntersectionObserver is cheaper and simpler than re-rendering.
   Elements are unobserved once revealed — nothing animates on scroll-up,
   which would fight the reader. */
(function(){
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var tag = function(){
    var root = document.getElementById("root");
    if (!root) return;

    // Section headings, cards, rows, and list items — everything below the
    // hero, which has its own Framer Motion entrance already.
    var sel = "section:not(#top) h2, section:not(#top) p.text-sm," +
              "section:not(#top) .liquid-glass, section:not(#top) .liquid-glass-strong," +
              "section:not(#top) h3, section:not(#top) li";
    var els = [].slice.call(document.querySelectorAll(sel))
                .filter(function(el){ return !el.closest("nav") && !el.classList.contains("sr"); });

    els.forEach(function(el, i){
      el.classList.add("sr");
      // Cards drift up, list items come from the left — varied enough to feel
      // composed, uniform enough not to look busy.
      if (el.tagName === "LI") el.classList.add("sr-l");
      else if (el.classList.contains("liquid-glass") ||
               el.classList.contains("liquid-glass-strong")) el.classList.add("sr-s");
    });

    if (reduce) { els.forEach(function(el){ el.classList.add("in"); }); return; }

    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (!e.isIntersecting) return;
        var sibs = [].slice.call(e.target.parentNode.children)
                     .filter(function(c){ return c.classList.contains("sr"); });
        var idx = Math.max(0, sibs.indexOf(e.target));
        e.target.style.transitionDelay = Math.min(idx, 6) * 70 + "ms";
        e.target.classList.add("in");
        io.unobserve(e.target);
      });
    }, { threshold:0.12, rootMargin:"0px 0px -7%" });
    els.forEach(function(el){ io.observe(el); });

    /* Section headings drift slightly as they pass — a small parallax that
       gives the page depth without moving anything the eye is reading. */
    var heads = [].slice.call(document.querySelectorAll("section:not(#top) h2"));
    if (!reduce && heads.length){
      var ticking = false;
      var onScroll = function(){
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(function(){
          var vh = innerHeight;
          heads.forEach(function(h){
            var r = h.getBoundingClientRect();
            if (r.bottom < 0 || r.top > vh) return;
            var p = (r.top + r.height/2 - vh/2) / vh;   // -0.5 … 0.5
            h.style.transform = "translateY(" + (p * -22).toFixed(1) + "px)";
          });
          ticking = false;
        });
      };
      addEventListener("scroll", onScroll, { passive:true });
      onScroll();
    }
  };
  // Wait for React to paint before tagging its output.
  requestAnimationFrame(function(){ requestAnimationFrame(tag); });
})();
</script>
