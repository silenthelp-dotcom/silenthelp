<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SilentHelp — Careers & HQ</title>
<meta name="description" content="Join SilentHelp — build technology that helps people. Open roles, team, and company HQ.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0a0d13;            /* page base — night, screen-off */
  --ink-raise:#10141c;      /* panel */
  --ink-raise2:#161b25;     /* nested / hover */
  --ink-pop:#1c2230;        /* popover / active */
  --hairline:rgba(255,255,255,.07);
  --hairline-2:rgba(255,255,255,.12);
  --t1:#e9edf5;             /* primary text */
  --t2:#a3adbf;             /* secondary */
  --t3:#69738a;             /* meta */
  --signal:#5aa2ff;         /* the one accent — SilentHelp blue, lifted for dark */
  --signal-dim:rgba(90,162,255,.14);
  --calm:#3ecf8e;           /* good */
  --watch:#f0b453;          /* attention */
  --crisis:#ff7070;         /* danger */
  --r-s:6px; --r-m:10px; --r-l:16px;
  --ease:cubic-bezier(.23,1,.32,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--ink);color:var(--t1);
  font:400 15px/1.55 "Inter",-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
::selection{background:var(--signal-dim);color:var(--t1)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{
  font:inherit;color:var(--t1);width:100%;
  background:#070a0f;border:1px solid var(--hairline);
  border-radius:var(--r-s);padding:9px 12px;outline:none;
  transition:border-color .15s var(--ease);
}
input:focus,textarea:focus,select:focus{border-color:var(--signal)}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;padding:0;border:none;border-radius:2px;background:var(--ink-pop);cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--signal);border:none}
textarea{resize:vertical;min-height:90px}
label{display:block;font-size:12px;font-weight:500;color:var(--t2);margin:14px 0 5px;letter-spacing:.02em}
h1,h2,h3{text-wrap:balance}
.serif{font-family:"Playfair Display",serif;font-style:italic;font-weight:500;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}

/* ---------- nav ---------- */
nav{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:26px;
  padding:0 28px;height:58px;
  background:rgba(10,13,19,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--hairline);
}
nav .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;margin-right:8px}
nav .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--signal);box-shadow:0 0 12px var(--signal)}
nav a.nl{font-size:13.5px;font-weight:500;color:var(--t2);padding:6px 2px;transition:color .15s}
nav a.nl:hover{color:var(--t1)}
nav a.nl.on{color:var(--t1)}
nav .sp{flex:1}
.btn{
  display:inline-flex;align-items:center;gap:7px;
  font-size:13.5px;font-weight:600;
  padding:9px 16px;border-radius:var(--r-s);
  background:var(--signal);color:#08101e;
  transition:transform .12s var(--ease),filter .15s;
  white-space:nowrap;
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--t1);box-shadow:inset 0 0 0 1px var(--hairline-2)}
.btn.ghost:hover{background:var(--ink-raise2)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.danger{background:transparent;color:var(--crisis);box-shadow:inset 0 0 0 1px rgba(255,112,112,.3)}

/* ---------- layout ---------- */
main{max-width:1120px;margin:0 auto;padding:0 28px 90px}
.view{animation:vin .35s var(--ease)}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.view{animation:none}}

/* ---------- hero ---------- */
.hero{padding:96px 0 64px;position:relative}
.stage-pill{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12px;font-weight:500;color:var(--t2);
  padding:5px 13px;border-radius:99px;
  background:var(--ink-raise);border:1px solid var(--hairline);
}
.stage-pill b{color:var(--signal);font-weight:600}
.hero h1{
  font-size:clamp(38px,6vw,62px);line-height:1.08;
  margin:26px 0 18px;letter-spacing:-.02em;font-weight:600;
}
.hero h1 em{font-family:"Playfair Display",serif;font-style:italic;font-weight:600;color:var(--signal)}
.hero p.lede{font-size:17px;color:var(--t2);max-width:560px;text-wrap:pretty}
.hero .cta{display:flex;gap:12px;margin-top:34px;flex-wrap:wrap}
.pulse{height:44px;width:100%;max-width:640px;margin-top:52px;opacity:.55}
.pulse path{stroke:var(--signal);stroke-width:1.5;fill:none;stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 3.2s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* signal meter — the team-capacity signature */
.meter{display:flex;gap:4px;align-items:flex-end;height:22px}
.meter i{width:9px;border-radius:2px;background:var(--ink-pop)}
.meter i.on{background:var(--signal)}
.meter i:nth-child(1){height:8px}.meter i:nth-child(2){height:10px}.meter i:nth-child(3){height:12px}
.meter i:nth-child(4){height:14px}.meter i:nth-child(5){height:15px}.meter i:nth-child(6){height:17px}
.meter i:nth-child(7){height:18px}.meter i:nth-child(8){height:20px}.meter i:nth-child(9){height:21px}
.meter i:nth-child(10){height:22px}

.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:64px}
.stat{
  background:var(--ink-raise);border:1px solid var(--hairline);
  border-radius:var(--r-m);padding:20px 22px;
}
.stat .k{font-size:11px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--t3)}
.stat .v{font-size:30px;font-weight:600;margin-top:8px;letter-spacing:-.02em}
.stat .s{font-size:12.5px;color:var(--t2);margin-top:4px}

/* ---------- section head ---------- */
.shead{margin:74px 0 26px}
.shead h2{font-size:26px;font-weight:600;letter-spacing:-.015em}
.shead h2 .serif{color:var(--signal);font-size:27px}
.shead p{color:var(--t2);margin-top:6px;font-size:14.5px}
.shead .row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* ---------- job cards ---------- */
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.job{
  background:var(--ink-raise);border:1px solid var(--hairline);
  border-radius:var(--r-l);padding:22px 24px;
  display:flex;flex-direction:column;gap:12px;
  transition:border-color .2s,transform .2s var(--ease);
  cursor:pointer;
}
.job:hover{border-color:var(--hairline-2);transform:translateY(-2px)}
.job .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.job h3{font-size:16.5px;font-weight:600;letter-spacing:-.01em}
.jdept{font-size:12px;font-weight:500;color:var(--signal)}
.tag{
  font-size:11px;font-weight:500;color:var(--t2);
  padding:3px 9px;border-radius:99px;
  background:var(--ink-raise2);border:1px solid var(--hairline);
  white-space:nowrap;
}
.tag.open{color:var(--calm);border-color:rgba(62,207,142,.25)}
.tag.filled{color:var(--t3)}
.job p{font-size:13.5px;color:var(--t2);flex:1;text-wrap:pretty}
.job .foot{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--t3)}

/* ---------- job detail ---------- */
.back{font-size:13px;color:var(--t2);display:inline-flex;gap:6px;align-items:center;margin:34px 0 8px}
.back:hover{color:var(--t1)}
.jd{display:grid;grid-template-columns:1fr 300px;gap:40px;align-items:start}
@media(max-width:840px){.jd{grid-template-columns:1fr}}
.jd h1{font-size:34px;font-weight:600;letter-spacing:-.02em;margin:6px 0 10px}
.jd .meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
.jd h4{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--t3);margin:30px 0 12px}
.jd ul{list-style:none}
.jd ul li{padding:7px 0 7px 22px;position:relative;color:var(--t2);font-size:14.5px;border-bottom:1px solid var(--hairline)}
.jd ul li::before{content:"";position:absolute;left:2px;top:15px;width:8px;height:2px;border-radius:2px;background:var(--signal)}
.side{
  background:var(--ink-raise);border:1px solid var(--hairline);
  border-radius:var(--r-l);padding:24px;position:sticky;top:80px;
}
.side .kv{display:flex;justify-content:space-between;font-size:13px;padding:9px 0;border-bottom:1px solid var(--hairline)}
.side .kv b{font-weight:500;color:var(--t3)}
.side .kv span{color:var(--t1);text-align:right}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}

/* ---------- team ---------- */
.depts{display:flex;flex-direction:column;gap:12px}
.deptbox{
  background:var(--ink-raise);border:1px solid var(--hairline);
  border-radius:var(--r-m);padding:18px 22px;
}
.deptbox .dh{display:flex;align-items:center;gap:14px}
.deptbox .dh h3{font-size:15px;font-weight:600;flex:1}
.deptbox .dh .cnt{font-size:12.5px;color:var(--t3)}
.bar{height:4px;border-radius:2px;background:var(--ink-pop);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;background:var(--signal);transition:width .6s var(--ease)}
.people{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.pchip{
  display:flex;align-items:center;gap:9px;
  background:var(--ink-raise2);border:1px solid var(--hairline);
  border-radius:99px;padding:5px 14px 5px 5px;font-size:13px;
  cursor:pointer;transition:border-color .15s;
}
.pchip:hover{border-color:var(--hairline-2)}
.pchip.vac{border-style:dashed;color:var(--t3);padding:9px 14px;cursor:pointer}
.av{
  width:28px;height:28px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;color:#08101e;
  background:var(--signal);overflow:hidden;
}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:64px;height:64px;font-size:22px}

/* profile */
.prof{display:flex;gap:22px;align-items:center;margin:14px 0 30px}
.prof h1{font-size:30px;font-weight:600;letter-spacing:-.02em}
.prof .sub{color:var(--t2);font-size:14.5px;margin-top:3px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:720px){.pgrid{grid-template-columns:1fr}}
.card{
  background:var(--ink-raise);border:1px solid var(--hairline);
  border-radius:var(--r-m);padding:20px 22px;
}
.card h4{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--t3);margin-bottom:12px}

/* ---------- admin / HQ ---------- */
.hq{display:grid;grid-template-columns:200px 1fr;gap:34px;margin-top:40px;align-items:start}
@media(max-width:820px){.hq{grid-template-columns:1fr}}
.hq .tabs{display:flex;flex-direction:column;gap:2px;position:sticky;top:80px}
@media(max-width:820px){.hq .tabs{flex-direction:row;flex-wrap:wrap;position:static}}
.hq .tabs button{
  text-align:left;font-size:13.5px;font-weight:500;color:var(--t2);
  padding:9px 13px;border-radius:var(--r-s);transition:background .15s,color .15s;
  display:flex;justify-content:space-between;align-items:center;gap:8px;
}
.hq .tabs button:hover{color:var(--t1);background:var(--ink-raise)}
.hq .tabs button.on{color:var(--t1);background:var(--ink-raise2)}
.pill{
  min-width:20px;height:20px;padding:0 6px;border-radius:99px;
  background:var(--signal);color:#08101e;font-size:11px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;
}
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.prog .lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px}
.prog .lbl b{font-weight:500;color:var(--t2)}
.prog{margin-top:16px}

/* pipeline board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:236px;gap:12px;overflow-x:auto;padding-bottom:14px}
.col{background:var(--ink-raise);border:1px solid var(--hairline);border-radius:var(--r-m);padding:12px;min-height:120px}
.col h5{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);padding:2px 4px 12px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.col h5::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--stage,var(--t3));flex:none;margin-right:auto;box-shadow:0 0 8px var(--stage,transparent)}
.col h5 .num{color:var(--t2);background:var(--ink-raise2);padding:1px 7px;border-radius:99px;font-size:11px}
.appcard{
  background:var(--ink-raise2);border:1px solid var(--hairline);
  border-radius:var(--r-s);padding:12px;margin-bottom:8px;font-size:13px;
  cursor:pointer;transition:border-color .15s,transform .15s var(--ease);
  border-left:2px solid var(--stage,var(--signal));
}
.appcard:hover{border-color:var(--hairline-2);transform:translateY(-1px)}
.appcard b{font-weight:600;display:block}
.appcard .r{color:var(--signal);font-size:12px;margin-top:2px}
.appcard .d{color:var(--t3);font-size:11.5px;margin-top:6px}

/* table-ish list rows */
.rowitem{
  display:flex;align-items:center;gap:14px;
  padding:13px 4px;border-bottom:1px solid var(--hairline);font-size:14px;
}
.rowitem .grow{flex:1;min-width:0}
.rowitem .grow small{display:block;color:var(--t3);font-size:12px;margin-top:1px}

/* notifications */
.note{display:flex;gap:13px;padding:13px 4px;border-bottom:1px solid var(--hairline);font-size:13.5px}
.note .ic{width:8px;height:8px;border-radius:50%;background:var(--signal);margin-top:7px;flex:none}
.note.dim{opacity:.5}.note.dim .ic{background:var(--t3)}
.note time{color:var(--t3);font-size:12px;display:block;margin-top:2px}

/* modal */
.mback{
  position:fixed;inset:0;z-index:100;background:rgba(4,6,10,.7);
  backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;
  padding:60px 20px;overflow-y:auto;animation:fadein .18s var(--ease);
}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--ink-pop);border:1px solid var(--hairline-2);
  border-radius:var(--r-l);padding:28px;width:100%;max-width:520px;
  animation:mup .22s var(--ease);
}
@keyframes mup{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.modal h3{font-size:18px;font-weight:600;margin-bottom:4px}
.modal .sub{font-size:13px;color:var(--t2)}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}

/* toast */
#toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink-pop);border:1px solid var(--hairline-2);color:var(--t1);
  font-size:13.5px;font-weight:500;padding:11px 20px;border-radius:99px;
  opacity:0;pointer-events:none;transition:all .25s var(--ease);z-index:200;
  box-shadow:0 8px 30px rgba(0,0,0,.5);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.empty{color:var(--t3);font-size:13.5px;padding:26px 0;text-align:center}
footer{
  border-top:1px solid var(--hairline);margin-top:100px;
  padding:34px 28px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;
  font-size:12.5px;color:var(--t3);max-width:1120px;margin-left:auto;margin-right:auto;
}
footer a{color:var(--t2)}footer a:hover{color:var(--t1)}
</style>
</head>
<body>

<nav>
  <a class="brand" href="#/"><span class="dot"></span>SilentHelp <span style="color:var(--t3);font-weight:400">HQ</span></a>
  <a class="nl" data-nav="careers" href="#/careers">Careers</a>
  <a class="nl" data-nav="team" href="#/team">Team</a>
  <a class="nl" data-nav="admin" href="#/admin">Founder HQ</a>
  <span class="sp"></span>
  <a class="nl" href="/" title="Back to product">← Product</a>
  <a class="btn sm" href="#/careers">Apply</a>
</nav>

<main><div id="view"></div></main>

<footer>
  <div><b style="color:var(--t2)">SilentHelp</b> — technology that helps people. Prototype stage · Founded 2026.</div>
  <div><a href="/privacy">Privacy</a> &nbsp;·&nbsp; <a href="/terms">Terms</a> &nbsp;·&nbsp; <a href="#/careers">Careers</a></div>
</footer>

<div id="toast"></div>
<div id="modalhost"></div>

<script>
/* =========================================================
   SilentHelp HQ — shared SPA (server-backed via /api/hq)
   Everyone who opens this page sees the same live company.
   ========================================================= */
const DEPTS = ["Executive","Engineering","Artificial Intelligence","Product","Design","Privacy & Compliance","Community Outreach","Marketing","Research"];
const STAGES = ["Applied","Under Review","Interview Scheduled","Technical Assessment","Final Interview","Offer Extended","Hired"];
const TEAM_TARGET = 10;

/* S holds the latest server state; empty until first load. */
let S = { stats:{activeProjects:0,ai:0,macos:0,beta:0,outreach:0}, positions:[], team:[], applicants:[], notes:[], tasks:{} };
let loaded = false;

/* Admin gate: Founder HQ is unlocked with a passcode kept in this browser.
   Editing endpoints are open on the server (small trusted team), but the
   admin *screens* stay hidden until unlocked so casual visitors don't see them. */
const ADMIN_PASS = "silenthelp";           // change any time; only gates the UI
let isAdmin = localStorage.getItem("shq_admin") === ADMIN_PASS;
// Convenience: open /careers?hq=silenthelp to unlock HQ directly (shareable link).
try{ const q=new URLSearchParams(location.search).get("hq"); if(q===ADMIN_PASS){ isAdmin=true; localStorage.setItem("shq_admin", ADMIN_PASS); } }catch(e){}

async function pull(){
  try{
    const r = await fetch("/api/hq", {cache:"no-store"});
    S = await r.json();
    loaded = true;
  }catch(e){ /* keep last state */ }
}
async function post(url, body){
  const r = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body||{})});
  S = await r.json();        // every mutation returns fresh full state
  return S;
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initials = n => n.split(/\s+/).map(w=>w[0]||"").join("").slice(0,2).toUpperCase();
const ago = ts => { const d=(Date.now()-ts)/1000; if(d<60)return "just now"; if(d<3600)return Math.max(1,Math.round(d/60))+"m ago"; if(d<86400)return Math.round(d/3600)+"h ago"; return Math.round(d/86400)+"d ago"; };
const toast = m => { const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove("show"),2400); };
const openCount = () => S.positions.filter(p=>p.status==="open").length;
const avat = (m,lg) => `<span class="av${lg?" lg":""}" style="${m.photo?"background:none":""}">${m.photo?`<img src="${esc(m.photo)}" alt="">`:esc(initials(m.name))}</span>`;
const meterHTML = n => { let h='<span class="meter" title="'+n+' of '+TEAM_TARGET+'">'; for(let i=1;i<=TEAM_TARGET;i++) h+='<i class="'+(i<=n?"on":"")+'"></i>'; return h+'</span>'; };
const tag = (txt,cls) => `<span class="tag ${cls||""}">${esc(txt)}</span>`;
const bar = pct => `<div class="bar"><i style="width:${Math.max(0,Math.min(100,pct))}%"></i></div>`;

/* ---------- modal ---------- */
function modal(html, onmount){
  const host = $("#modalhost");
  host.innerHTML = `<div class="mback" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
  document.body.style.overflow="hidden";
  if(onmount) onmount(host);
}
function closeModal(){ $("#modalhost").innerHTML=""; document.body.style.overflow=""; }

/* =========================================================
   VIEWS
   ========================================================= */
const V = {};

/* ---------- landing ---------- */
V.home = () => `
<section class="hero view">
  <span class="stage-pill"><b>●</b> Current stage: Prototype → School Beta</span>
  <h1>Build technology<br>that <em>helps people.</em></h1>
  <p class="lede">SilentHelp is a privacy-first digital-wellness company that notices the signals people don't say out loud — and gets them help before they have to ask. Everything runs on-device. Nothing leaves without consent.</p>
  <div class="cta">
    <a class="btn" href="#/careers">View open positions →</a>

async function submitApp(e){
  e.preventDefault();
  const f = new FormData(e.target);
  const a = {};
  ["name","email","role","resume","portfolio","linkedin","github","avail","cover"].forEach(k=>a[k]=(f.get(k)||"").toString().trim());
  const btn = e.target.querySelector("button"); btn.disabled=true; btn.textContent="Submitting…";
  await post("/api/hq/apply", a);
  location.hash = "#/careers"; render();
  toast("Application submitted — we'll be in touch. ✓");
}

function viewApp(id){
  const a = S.applicants.find(x=>x.id===id); if(!a) return;
  const si = STAGES.indexOf(a.stage);
  const link = (l,u)=>u?`<div class="kv"><b>${l}</b><span><a href="${esc(/^https?:/.test(u)?u:"https://"+u)}" target="_blank" style="color:var(--signal)">${esc(u)}</a></span></div>`:"";
  modal(`
    <h3>${esc(a.name)}</h3><div class="sub">${esc(a.role)} · applied ${ago(a.ts)} · <b style="color:var(--signal)">${esc(a.stage)}</b></div>
    <div style="margin-top:14px">
      <div class="kv"><b>Email</b><span>${esc(a.email)}</span></div>
      <div class="kv"><b>Availability</b><span>${esc(a.avail||"—")}</span></div>
      ${link("Resume",a.resume)}${link("Portfolio",a.portfolio)}${link("LinkedIn",a.linkedin)}${link("GitHub",a.github)}
    </div>
    <h4 style="font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--t3);margin:18px 0 8px">Cover letter</h4>
    <p style="font-size:14px;color:var(--t2);white-space:pre-wrap">${esc(a.cover||"—")}</p>
    <div class="acts">
      <button class="btn sm danger" onclick="setStage('${a.id}','Rejected')">Reject</button>
      ${si>0 && a.stage!=="Hired" ? `<button class="btn sm ghost" onclick="setStage('${a.id}','${STAGES[si-1]}')">← ${STAGES[si-1]}</button>`:""}
      ${a.stage!=="Hired" ? (si<STAGES.length-2
        ? `<button class="btn sm" onclick="setStage('${a.id}','${STAGES[si+1]}')">Advance → ${STAGES[si+1]}</button>`
        : `<button class="btn sm" onclick="hireApp('${a.id}')">Hire 🎉</button>`) : ""}
    </div>`);
}
async function setStage(id, st){
  await post("/api/hq/stage", {id, stage:st}); closeModal(); render();
}
async function hireApp(id){
  const a = S.applicants.find(x=>x.id===id);
  await post("/api/hq/hire", {id}); closeModal(); render();
  toast(`${a?a.name:"Applicant"} added to the team ✓`);
}

async function delPos(id){ const p=S.positions.find(x=>x.id===id); if(!confirm(`Delete "${p.title}"?`))return; await post("/api/hq/position/delete", {id}); render(); toast("Position deleted"); }

async function savePosition(e, id){
  e.preventDefault();
  const f = new FormData(e.target);
  const lines = k => (f.get(k)||"").toString().split("\n").map(s=>s.trim()).filter(Boolean);
  const p = { title:f.get("title").toString().trim(), dept:f.get("dept"), loc:f.get("loc"),
    type:f.get("type"), desc:f.get("desc"), team:f.get("team"),
    resp:lines("resp"), skills:lines("skills"), pref:lines("pref"),
    tech:lines("tech"), projects:lines("projects") };
  if(id) p.id = id;
  await post("/api/hq/position", p); closeModal(); render(); toast("Position saved ✓");
}

async function delMember(id){ const m=S.team.find(x=>x.id===id); if(!confirm(`Remove ${m.name} from the team?`))return; await post("/api/hq/member/delete", {id}); render(); toast("Removed"); }
function editMember(id){
  const m = S.team.find(x=>x.id===id) || {};
  modal(`
    <h3>${id?"Edit teammate":"Add teammate"}</h3>
    <form onsubmit="saveMember(event,'${id||""}')">
      <div class="grid2">
        <div><label>Name *</label><input name="name" required value="${esc(m.name||"")}"></div>
        <div><label>Role *</label><input name="role" required value="${esc(m.role||"")}" placeholder="e.g. Lead AI Engineer"></div>
      </div>
      <div class="grid2">
        <div><label>Department</label><select name="dept">${DEPTS.map(d=>`<option ${m.dept===d?"selected":""}>${d}</option>`).join("")}</select></div>
        <div><label>Joined</label><input name="joined" type="date" value="${esc(m.joined||new Date().toISOString().slice(0,10))}"></div>
      </div>
      <label>Skills (comma-separated)</label><input name="skills" value="${esc((m.skills||[]).join(", "))}">
      <label>Current projects (comma-separated)</label><input name="projects" value="${esc((m.projects||[]).join(", "))}">
      <div class="grid2">
        <div><label>Sprint progress %</label><input name="progress" type="number" min="0" max="100" value="${m.progress||0}"></div>
        <div><label>Contact (optional, shown on profile)</label><input name="contact" value="${esc(m.contact||"")}"></div>
      </div>
      <label>Profile picture</label><input name="photofile" type="file" accept="image/*" style="padding:7px">
      <label>Short bio</label><textarea name="bio" style="min-height:60px">${esc(m.bio||"")}</textarea>
      <div class="acts"><button type="button" class="btn sm ghost" onclick="closeModal()">Cancel</button><button class="btn sm">Save</button></div>
    </form>`);
}
function saveMember(e, id){
  e.preventDefault();
  const f = new FormData(e.target);
  const csv = k => (f.get(k)||"").toString().split(",").map(s=>s.trim()).filter(Boolean);
  const m = { name:f.get("name").toString().trim(), role:f.get("role").toString().trim(),
    dept:f.get("dept"), joined:f.get("joined"), skills:csv("skills"), projects:csv("projects"),
    progress:Math.max(0,Math.min(100,+f.get("progress")||0)), contact:f.get("contact"), bio:f.get("bio") };
  if(id) m.id = id;
  const done = async () => { await post("/api/hq/member", m); closeModal(); render(); toast("Saved ✓"); };
  const file = f.get("photofile");
  if(file && file.size){
    if(file.size > 400*1024){ toast("Image too large — keep under 400 KB"); return; }
    const r = new FileReader(); r.onload = () => { m.photo = r.result; done(); }; r.readAsDataURL(file);
  } else done();
}
function assignTask(id){
  const m = S.team.find(x=>x.id===id);
  modal(`
    <h3>Assign task — ${esc(m.name)}</h3>
    <form onsubmit="saveTask(event,'${id}')">
      <label>Task *</label><input name="t" required placeholder="What needs to get done?">
      <label>Deadline</label><input name="due" type="date">
      <div class="acts"><button type="button" class="btn sm ghost" onclick="closeModal()">Cancel</button><button class="btn sm">Assign</button></div>
    </form>`);
}
async function saveTask(e, id){
  e.preventDefault();
  const f = new FormData(e.target);
  await post("/api/hq/task", {id, t:f.get("t").toString().trim(), due:f.get("due")});
  closeModal(); render(); toast("Task assigned ✓");
}
async function toggleTask(id, i){ await post("/api/hq/task/toggle", {id, idx:i}); }

/* =========================================================
   ROUTER
   ========================================================= */
function render(){
  const h = location.hash.replace(/^#\/?/, "") || "";
  const [r, arg] = h.split("/");
  const map = { "":["home"], careers:["careers"], job:["job",arg], apply:["apply",arg],
                team:["team"], member:["member",arg], admin:["admin"] };
  const [fn, a] = map[r] || ["home"];
  if(!loaded){ $("#view").innerHTML = '<div class="empty view" style="padding:120px 0">Loading SilentHelp HQ…</div>'; return; }
  $("#view").innerHTML = V[fn](a);
  document.querySelectorAll("nav a.nl[data-nav]").forEach(el=>el.classList.toggle("on", el.dataset.nav===r || (r==="job"||r==="apply")&&el.dataset.nav==="careers" || r==="member"&&el.dataset.nav==="team"));
  if(!location.hash.includes("keep-scroll")) window.scrollTo({top:0});
}
window.addEventListener("hashchange", render);

/* boot: load shared state, then render */
(async () => { await pull(); render(); })();
</script>
</body>
</html>
