<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SilentHelp — Survey Results</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="180x180" href="/static/img/badge-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/tailwind.css">
<style>
  html, body { background:#000; }
  body { margin:0; font-family:'Barlow',sans-serif; -webkit-font-smoothing:antialiased; }

  .liquid-glass{
    background: rgba(255,255,255,0.01);
    background-blend-mode: luminosity;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    border: none;
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
    position: relative; overflow: hidden;
  }
  .liquid-glass::before{
    content:""; position:absolute; inset:0; border-radius:inherit; padding:1.4px;
    background: linear-gradient(180deg,
      rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%,
      rgba(255,255,255,0) 40%,  rgba(255,255,255,0) 60%,
      rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events:none;
  }
  .hovup{ transition:transform .18s cubic-bezier(.16,1,.3,1), opacity .18s; }
  .hovup:hover{ transform:translateY(-1px); opacity:.92; }
  .hovup:active{ transform:translateY(0) scale(.98); }

  .bar-track{ height:8px; border-radius:999px; background:rgba(255,255,255,.08); overflow:hidden; }
  .bar-fill{ height:100%; border-radius:999px; background:#fff; transition:width .5s cubic-bezier(.16,1,.3,1); }

  .empty-state{ text-align:center; padding:120px 24px; }
</style>
</head>
<body class="bg-black min-h-screen text-white">
<div class="max-w-3xl mx-auto px-6 py-14">

  <div class="flex items-center justify-between mb-12 flex-wrap gap-4">
    <div class="flex items-center gap-2 font-body text-[13px] text-white/60">
      <span class="w-2 h-2 rounded-full bg-white"></span>
      <span class="text-white font-medium tracking-tight">SILENTHELP</span><span>· survey results</span>
    </div>
    <a href="/careers" class="hovup font-body text-[13px] text-white/50 hover:text-white/80">← Back to HQ</a>
  </div>

  <div id="loading" class="empty-state">
    <div class="font-body text-white/40 text-[14px]">Loading results…</div>
  </div>

  <div id="content" style="display:none">
    <h1 class="font-heading italic text-white text-4xl md:text-[2.75rem] tracking-[-1px] leading-[1.05] mb-8">Results</h1>

    <div class="grid grid-cols-3 gap-4 mb-14">
      <div class="liquid-glass rounded-2xl p-5">
        <div class="font-body text-[11px] tracking-[.08em] text-white/40 mb-2">TOTAL RESPONSES</div>
        <div class="font-heading italic text-3xl" id="statTotal">—</div>
      </div>
      <div class="liquid-glass rounded-2xl p-5">
        <div class="font-body text-[11px] tracking-[.08em] text-white/40 mb-2">WOULD USE</div>
        <div class="font-heading italic text-3xl" id="statYes">—</div>
      </div>
      <div class="liquid-glass rounded-2xl p-5">
        <div class="font-body text-[11px] tracking-[.08em] text-white/40 mb-2">WOULD NOT</div>
        <div class="font-heading italic text-3xl" id="statNo">—</div>
      </div>
    </div>

    <div class="mb-14">
      <div class="font-body text-[13px] font-semibold text-white/70 mb-4 tracking-[.02em]">WOULD YOU USE SILENTHELP?</div>
      <div id="wuBars" class="flex flex-col gap-3"></div>
    </div>

    <div class="font-body text-[13px] font-semibold text-white/70 mb-5 tracking-[.02em]">QUESTION BREAKDOWN</div>
    <div id="questions" class="flex flex-col gap-8"></div>
  </div>

  <div id="empty" class="empty-state" style="display:none">
    <div class="font-heading italic text-3xl mb-3">No responses yet.</div>
    <div class="font-body text-white/50 text-[14px]">Results will show up here once people start taking the survey.</div>
  </div>

  <div id="denied" class="empty-state" style="display:none">
    <div class="font-heading italic text-3xl mb-3">Not signed in.</div>
    <div class="font-body text-white/50 text-[14px]">Sign in to HQ to view survey results.</div>
    <a href="/careers" class="hovup inline-block mt-6 bg-white text-black rounded-full px-6 py-3 text-[14px] font-medium font-body">Go to HQ</a>
  </div>
</div>

<script>
function bar(label, count, total, color){
  const pct = total > 0 ? Math.round(count / total * 100) : 0;
  return `<div>
    <div class="flex items-center justify-between font-body text-[13.5px] mb-1.5">
      <span class="text-white/85">${label}</span>
      <span class="text-white/50">${count} · ${pct}%</span>
    </div>
    <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${color || '#fff'}"></div></div>
  </div>`;
}

async function load(){
  let res;
  try {
    res = await fetch('/api/survey/results');
  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('denied').style.display = 'block';
    return;
  }
  if (res.status === 401){
    document.getElementById('loading').style.display = 'none';
    document.getElementById('denied').style.display = 'block';
    return;
  }
  const data = await res.json();
  document.getElementById('loading').style.display = 'none';

  if (!data.total){
    document.getElementById('empty').style.display = 'block';
    return;
  }

  document.getElementById('content').style.display = 'block';
  document.getElementById('statTotal').textContent = data.total;
  const wu = data.would_use;
  document.getElementById('statYes').textContent = wu.yes;
  document.getElementById('statNo').textContent = wu.no;

  document.getElementById('wuBars').innerHTML =
    bar('Yes, I\'d use this', wu.yes, data.total, '#fff') +
    bar('Maybe — depends', wu.maybe, data.total, 'rgba(255,255,255,.6)') +
    bar('No, not for me', wu.no, data.total, 'rgba(255,255,255,.35)');

  document.getElementById('questions').innerHTML = data.questions.map((q, qi) => `
    <div class="liquid-glass rounded-2xl p-6">
      <div class="font-body text-[11.5px] text-white/40 mb-1.5">QUESTION ${qi+1}</div>
      <div class="font-body text-[16px] font-medium mb-5">${q.text}</div>
      <div class="flex flex-col gap-3">
        ${q.options.map(o => bar(o, q.counts[o] || 0, data.total)).join('')}
      </div>
    </div>
  `).join('');
}

load();
</script>
</body>
</html>
