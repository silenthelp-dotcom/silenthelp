databases:
  # Free managed Postgres — the shared HQ (positions, team, applicants,
  # pipeline) lives here so it survives web-service restarts and redeploys.
  - name: silenthelp-hq
    plan: free
    databaseName: silenthelp_hq
    user: silenthelp

services:
  - type: web
    name: silenthelp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker keeps HQ writes serialized (single lock, no cross-process race).
    # Threads let SSE streams (/api/hq/stream) run without blocking other requests.
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: silenthelp-hq
          property: connectionString
      - key: GROQ_API_KEY
        sync: false          # set this in the Render dashboard, never in git
      - key: NVIDIA_API_KEY
        sync: false          # detection model key — set in the dashboard
      - key: SECRET_KEY
        sync: false          # session-signing key — set ONCE in the dashboard and
                              # never change it. generateValue: true silently
                              # regenerates on some blueprint re-syncs, which
                              # invalidates every existing session cookie at once
                              # (every signed-in user gets logged out with no
                              # error — this was the "signed out after a while"
                              # symptom). A fixed value set here survives deploys.
      - key: PYTHON_VERSION
        value: "3.12.7"

  # SilentHelp HQ (team workspace) — static React frontend at hq.silenthelp.org.
  # Backend is Supabase (project tqdguunpyjmpptsqrwrd); see hq/SETUP.md.
  # Only public browser values here: the Supabase URL and publishable key.
  - type: web
    runtime: static
    name: silenthelp-hq-web
    rootDir: hq
    buildCommand: npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_DEMO_MODE
        value: "false"
      - key: VITE_SUPABASE_URL
        value: https://tqdguunpyjmpptsqrwrd.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        value: sb_publishable_KFeDURTbsI0mAbegKeMt8g_ZtIUaezP
      - key: NODE_VERSION
        value: "22.12.0"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://tqdguunpyjmpptsqrwrd.supabase.co wss://tqdguunpyjmpptsqrwrd.supabase.co; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
