databases:
  # Free managed Postgres — the shared HQ (positions, team, applicants,
  # pipeline) lives here so it survives web-service restarts and redeploys.
  - name: silenthelp-hq
    plan: free
    databaseName: silenthelp_hq
    user: silenthelp

services:
  - type: web
    name: silenthelp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker keeps HQ writes serialized (single lock, no cross-process race).
    # Threads let SSE streams (/api/hq/stream) run without blocking other requests.
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: silenthelp-hq
          property: connectionString
      - key: GROQ_API_KEY
        sync: false          # set this in the Render dashboard, never in git
      - key: NVIDIA_API_KEY
        sync: false          # detection model key — set in the dashboard
      # Clerk auth. Use the PRODUCTION keys (pk_live_… / sk_live_…) here, since
      # this service runs on the custom domain silenthelp.org. Both must be set
      # or clerk_auth.configured() is False and sign-in falls back to the legacy
      # form (that is the current symptom: the page serves var PK = "").
      - key: CLERK_PUBLISHABLE_KEY
        sync: false          # pk_live_… — set in the dashboard
      - key: CLERK_SECRET_KEY
        sync: false          # sk_live_… — set in the dashboard, never in git
      - key: SECRET_KEY
        generateValue: true  # random session-signing key (code default is public)
      - key: PYTHON_VERSION
        value: "3.12.7"
